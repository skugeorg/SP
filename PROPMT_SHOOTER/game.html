<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>P2P 3D Shooter</title>
<style>
  body { margin:0; overflow:hidden; font-family:Arial; background:#000; color:#fff; }
  #menu { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
  #menu h1 { font-size:48px; margin:0 0 20px; color:#0f0; text-shadow:0 0 20px #0f0; }
  #menu button { padding:14px 28px; font-size:20px; margin:8px; border:2px solid #0f0; background:#111; color:#0f0; cursor:pointer; border-radius:4px; }
  #menu button:hover { background:#0f0; color:#000; }
  #connStatus { margin-top:20px; font-size:18px; color:#ff0; text-align:center; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #crosshair { position:absolute; top:50%; left:50%; width:20px; height:20px; transform:translate(-50%,-50%); border:2px solid #0f0; border-radius:50%; box-shadow:0 0 10px #0f0; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:#0f0; }
  #crosshair::before { top:50%; left:-10px; right:-10px; height:2px; transform:translateY(-50%); }
  #crosshair::after { left:50%; top:-10px; bottom:-10px; width:2px; transform:translateX(-50%); }
  #healthbar { position:absolute; bottom:30px; left:30px; width:250px; height:20px; background:#333; border:2px solid #fff; border-radius:4px; overflow:hidden; }
  #healthfill { height:100%; background:linear-gradient(90deg,#f00,#0f0); transition:width 0.2s; }
  #score { position:absolute; top:20px; right:30px; font-size:24px; text-shadow:2px 2px 4px #000; }
  #status { position:absolute; top:20px; left:30px; font-size:16px; text-shadow:2px 2px 4px #000; }
  #msg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:48px; text-shadow:0 0 20px #000; opacity:0; transition:opacity 0.3s; pointer-events:none; }
  #ammo { position:absolute; bottom:30px; right:30px; font-size:28px; text-shadow:2px 2px 4px #000; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="menu">
  <h1>⚡ 3D SHOOTER ⚡</h1>
  <div id="connStatus">⏳ Подключение к серверу...</div>
  <button id="btnStart" class="hidden" onclick="startGame()">🎮 НАЧАТЬ ИГРУ</button>
</div>
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="healthbar"><div id="healthfill" style="width:100%"></div></div>
  <div id="score">Счёт: <span id="scoreVal">0</span> | Смерти: <span id="deathsVal">0</span></div>
  <div id="status">HP: 100</div>
  <div id="ammo">∞</div>
  <div id="msg"></div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
let ws, myId = -1, connected = false, partnerReady = false;
const state = {
  myHP: 100, enemyHP: 100, myScore: 0, myDeaths: 0,
  myPos: {x:0,y:1.7,z:0}, myRot: {x:0,y:0},
  enemyPos: {x:10,y:1.7,z:10}, enemyRot: {x:0,y:0},
  keys: {}, velocity: {x:0,y:0,z:0}, onGround: true
};

const menu = document.getElementById('menu');
const hud = document.getElementById('hud');
const msgEl = document.getElementById('msg');
const statusEl = document.getElementById('connStatus');

function showMsg(text, color='#fff') {
  msgEl.textContent = text;
  msgEl.style.color = color;
  msgEl.style.opacity = 1;
  setTimeout(()=> msgEl.style.opacity = 0, 1500);
}

// ===== ПОДКЛЮЧЕНИЕ К СЕРВЕРУ =====
const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
ws = new WebSocket(`${wsProto}//${location.host}`);

ws.onopen = () => {
  statusEl.textContent = '✅ Подключено к серверу! Ждём второго игрока...';
};

ws.onmessage = (e) => {
  const data = JSON.parse(e.data);
  
  if (data.type === 'init') {
    myId = data.id;
    statusEl.innerHTML = `✅ Ты — Игрок ${myId + 1}<br>` +
      (data.total < 2 ? '⏳ Ждём второго игрока...' : '🎮 Второй игрок подключился!');
    if (data.total === 2) {
      partnerReady = true;
      document.getElementById('btnStart').classList.remove('hidden');
    }
  } else if (data.type === 'full') {
    statusEl.textContent = '❌ Комната заполнена (максимум 2)';
  } else if (data.type === 'partner_left') {
    showMsg('❌ Друг вышел из игры', '#f00');
    setTimeout(()=> location.reload(), 2000);
  } else if (data.type === 'pos') {
    state.enemyPos = data.pos;
    state.enemyRot = data.rot;
  } else if (data.type === 'shoot') {
    spawnBullet(new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z),
                new THREE.Vector3(data.dir.x, data.dir.y, data.dir.z), false);
  } else if (data.type === 'hit') {
    state.enemyHP -= 10;
    if (state.enemyHP <= 0) {
      state.myScore++;
      showMsg('🏆 Убийство!', '#0f0');
      respawnEnemy();
    }
    updateHUD();
  } else if (data.type === 'die') {
    state.myScore++;
    showMsg('🏆 Убийство!', '#0f0');
    respawnEnemy();
    updateHUD();
  }
};

ws.onclose = () => {
  statusEl.textContent = '❌ Соединение с сервером потеряно';
};

function startGame() {
  connected = true;
  menu.classList.add('hidden');
  hud.classList.remove('hidden');
  renderer.domElement.requestPointerLock();
  updateHUD();
}

// ===== THREE.JS SCENE =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 100);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 1.7, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({color:0x3a7d3a})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(200, 40, 0x000000, 0x222222);
grid.position.y = 0.01;
scene.add(grid);

const obstacles = [];
function addBox(x, y, z, w, h, d, color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({color})
  );
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  obstacles.push({mesh:m, min:{x:x-w/2,z:z-d/2}, max:{x:x+w/2,z:z+d/2}, h});
  return m;
}
addBox(0, 2, -30, 60, 4, 1, 0x888888);
addBox(0, 2, 30, 60, 4, 1, 0x888888);
addBox(-30, 2, 0, 1, 4, 60, 0x888888);
addBox(30, 2, 0, 1, 4, 60, 0x888888);
addBox(-10, 1.5, -10, 4, 3, 1, 0x8b4513);
addBox(10, 1.5, 10, 4, 3, 1, 0x8b4513);
addBox(-10, 1.5, 10, 1, 3, 4, 0x8b4513);
addBox(10, 1.5, -10, 1, 3, 4, 0x8b4513);
addBox(0, 1, 0, 3, 2, 3, 0x666666);
addBox(-20, 1.5, 0, 2, 3, 8, 0x8b4513);
addBox(20, 1.5, 0, 2, 3, 8, 0x8b4513);
addBox(0, 1.5, -20, 8, 3, 2, 0x8b4513);
addBox(0, 1.5, 20, 8, 3, 2, 0x8b4513);

const enemy = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4, 1, 4, 8),
  new THREE.MeshStandardMaterial({color:0xff3333})
);
body.position.y = 1;
body.castShadow = true;
enemy.add(body);
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 16, 16),
  new THREE.MeshStandardMaterial({color:0xffccaa})
);
head.position.y = 1.9;
head.castShadow = true;
enemy.add(head);
const gun = new THREE.Mesh(
  new THREE.BoxGeometry(0.1, 0.1, 0.6),
  new THREE.MeshStandardMaterial({color:0x222222})
);
gun.position.set(0.3, 1.2, 0.3);
enemy.add(gun);
enemy.position.set(10, 0, 10);
scene.add(enemy);

const myGun = new THREE.Group();
const gunBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.1, 0.15, 0.5),
  new THREE.MeshStandardMaterial({color:0x111111})
);
const gunBarrel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.03, 0.03, 0.4),
  new THREE.MeshStandardMaterial({color:0x333333})
);
gunBarrel.rotation.x = Math.PI/2;
gunBarrel.position.z = -0.4;
myGun.add(gunBody); myGun.add(gunBarrel);
myGun.position.set(0.3, -0.3, -0.5);
camera.add(myGun);
scene.add(camera);

const muzzle = new THREE.PointLight(0xffaa00, 0, 5);
muzzle.position.set(0.3, -0.2, -1);
camera.add(muzzle);

const bullets = [];
function spawnBullet(from, dir, isMine) {
  const b = new THREE.Mesh(
    new THREE.SphereGeometry(0.05),
    new THREE.MeshBasicMaterial({color: isMine ? 0xffff00 : 0xff0000})
  );
  b.position.copy(from);
  scene.add(b);
  bullets.push({mesh:b, dir:dir.clone(), life:60, isMine});
}

// ===== CONTROLS =====
let yaw = 0, pitch = 0;

document.addEventListener('keydown', e => { state.keys[e.code] = true; });
document.addEventListener('keyup', e => { state.keys[e.code] = false; });

renderer.domElement.addEventListener('click', () => {
  if (connected) renderer.domElement.requestPointerLock();
});

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, pitch));
  state.myRot.x = pitch;
  state.myRot.y = yaw;
});

document.addEventListener('mousedown', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  if (e.button === 0) shoot();
});

function shoot() {
  const dir = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  const from = camera.position.clone();
  spawnBullet(from, dir, true);
  muzzle.intensity = 3;
  setTimeout(()=> muzzle.intensity = 0, 50);
  myGun.position.z = -0.35;
  setTimeout(()=> myGun.position.z = -0.5, 80);
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({type:'shoot', pos:from, dir}));
  }
}

function checkCollision(x, z, r=0.4) {
  if (x < -29 || x > 29 || z < -29 || z > 29) return true;
  for (const o of obstacles) {
    if (x+r > o.min.x && x-r < o.max.x && z+r > o.min.z && z-r < o.max.z) return true;
  }
  return false;
}

function update() {
  if (!connected) return;
  
  const speed = state.keys['ShiftLeft'] ? 0.15 : 0.08;
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  let mx = 0, mz = 0;
  if (state.keys['KeyW']) { mx += forward.x; mz += forward.z; }
  if (state.keys['KeyS']) { mx -= forward.x; mz -= forward.z; }
  if (state.keys['KeyD']) { mx += right.x; mz += right.z; }
  if (state.keys['KeyA']) { mx -= right.x; mz -= right.z; }
  const len = Math.hypot(mx, mz);
  if (len > 0) { mx = mx/len * speed; mz = mz/len * speed; }
  
  if (state.keys['Space'] && state.onGround) {
    state.velocity.y = 0.2;
    state.onGround = false;
  }
  state.velocity.y -= 0.01;
  
  const nx = camera.position.x + mx;
  const nz = camera.position.z + mz;
  if (!checkCollision(nx, camera.position.z)) camera.position.x = nx;
  if (!checkCollision(camera.position.x, nz)) camera.position.z = nz;
  
  camera.position.y += state.velocity.y;
  if (camera.position.y <= 1.7) {
    camera.position.y = 1.7;
    state.velocity.y = 0;
    state.onGround = true;
  }
  
  state.myPos.x = camera.position.x;
  state.myPos.y = camera.position.y;
  state.myPos.z = camera.position.z;
  
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.add(b.dir.clone().multiplyScalar(1.5));
    b.life--;
    
    if (b.isMine) {
      const d = b.mesh.position.distanceTo(enemy.position.clone().add(new THREE.Vector3(0,1,0)));
      if (d < 0.8) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'hit'}));
        scene.remove(b.mesh);
        bullets.splice(i,1);
        continue;
      }
    } else {
      const d = b.mesh.position.distanceTo(camera.position);
      if (d < 0.6) {
        state.myHP -= 10;
        updateHUD();
        scene.remove(b.mesh);
        bullets.splice(i,1);
        if (state.myHP <= 0) die();
        continue;
      }
    }
    
    if (checkCollision(b.mesh.position.x, b.mesh.position.z, 0.1) || b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i,1);
    }
  }
  
  if (ws && ws.readyState === 1 && Math.random() < 0.3) {
    ws.send(JSON.stringify({type:'pos', pos:state.myPos, rot:state.myRot}));
  }
}

function updateHUD() {
  document.getElementById('healthfill').style.width = Math.max(0, state.myHP) + '%';
  document.getElementById('status').textContent = 'HP: ' + Math.max(0, state.myHP);
  document.getElementById('scoreVal').textContent = state.myScore;
  document.getElementById('deathsVal').textContent = state.myDeaths;
}

function die() {
  state.myHP = 100;
  state.myDeaths++;
  camera.position.set(0, 1.7, 0);
  showMsg('💀 Ты убит!', '#f00');
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'die'}));
  updateHUD();
}

function respawnEnemy() {
  state.enemyHP = 100;
  enemy.position.set(10 + (Math.random()-0.5)*10, 0, 10 + (Math.random()-0.5)*10);
}

function animate() {
  requestAnimationFrame(animate);
  update();
  enemy.position.lerp(new THREE.Vector3(state.enemyPos.x, 0, state.enemyPos.z), 0.2);
  if (state.enemyRot) enemy.rotation.y = state.enemyRot.y;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
